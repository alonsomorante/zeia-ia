<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTIPO · Dashboard del cliente · ZEIA</title>
<!--
  PROTOTIPO DESECHABLE: no es la página de producción.
  Pregunta: ¿cómo debería verse el dashboard que usará el cliente?
  Tres variantes en esta misma página: ?variant=A (Tablero) | B (Informe vivo) | C (Explorador)
  Los datos reales los inyecta scripts/prototype_dashboard.py (salida en analisis/, gitignored).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@87.5..112.5,300..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@300..800&family=Chivo+Mono:wght@300..700&display=swap">
<style>
/* ================= Base compartida ================= */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:84px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
h1,h2,h3,h4,p{margin:0}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.saltar{position:absolute;left:-9999px;top:8px;z-index:100;padding:8px 12px;background:#000;color:#fff;border-radius:6px}
.saltar:focus{left:8px}
.num{font-variant-numeric:tabular-nums lining-nums}
.chart{width:100%;height:260px}
.chart.alto{height:330px}
.chart.bajo{height:190px}
svg.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--foco,#2563eb);outline-offset:2px}
.vacio{max-width:620px;margin:12vh auto;padding:0 24px;font-family:system-ui,sans-serif;line-height:1.5}
.vacio pre{background:#111;color:#eee;padding:12px 14px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

/* Delta (variación vs periodo anterior): más consumo = rojo, menos = verde */
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:11.5px;line-height:1;padding:4px 7px;border-radius:6px;white-space:nowrap}
.delta.malo{color:var(--malo);background:var(--malo-bg)}
.delta.bueno{color:var(--bueno);background:var(--bueno-bg)}
.delta.neutro{color:var(--mut);background:var(--neutro-bg)}

/* Notas de calidad */
.notas{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px}
.notas li{font-size:11.5px;line-height:1.4;color:var(--mut);display:flex;gap:6px;align-items:baseline}
.notas li::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55;flex:none;transform:translateY(-1px)}
.notas li.alerta{color:var(--alerta)}

/* Chips de preguntas */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 11px;font-size:12.5px;line-height:1.2;text-align:left}
.chip:hover{border-color:var(--ink)}

/* Mensajes del chat (los tres diseños los usan con sus variables) */
.msg{max-width:100%;font-size:13.5px;line-height:1.5}
.msg.yo{align-self:flex-end;max-width:85%;background:var(--ink);color:var(--card);padding:9px 12px;border-radius:14px 14px 4px 14px}
.msg.ia{align-self:stretch;background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px}
.msg-estado{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12.5px}
.msg-estado::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--acc);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.msg h4{font-size:13.5px;margin-bottom:4px}
.msg-texto{margin-top:6px}
.msg-texto.entra{animation:entra .45s ease both}
@keyframes entra{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg .chart{height:190px;margin-top:6px}
.fijar{display:inline-flex;align-items:center;gap:6px;margin-top:10px;border:1px solid var(--acc);color:var(--acc);background:transparent;border-radius:8px;padding:6px 10px;font-weight:600;font-size:12.5px}
.fijar:hover{background:var(--acc-soft)}
.fijar:disabled{border-color:var(--line);color:var(--mut);background:transparent}

/* Barra flotante del PROTOTIPO (no es parte del diseño) */
#proto{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:4px;padding:5px;background:#111214;color:#f4f4f5;border:1px solid rgba(255,255,255,.2);border-radius:999px;box-shadow:0 12px 32px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25);font:500 12.5px/1 ui-monospace,'Martian Mono',monospace;white-space:nowrap;max-width:calc(100vw - 16px)}
#proto .tag{padding:7px 10px;border-radius:999px;background:#fde047;color:#111;font-weight:700;letter-spacing:.08em;font-size:10.5px}
#proto button{border:0;background:transparent;color:inherit;height:32px;min-width:32px;border-radius:999px;padding:0 11px}
#proto button:hover{background:rgba(255,255,255,.12)}
#proto button[aria-pressed="true"]{background:#f4f4f5;color:#111}
#proto .var{min-width:168px;text-align:center}
#proto .sep{width:1px;height:20px;background:rgba(255,255,255,.22);margin:0 3px}
#proto .nota{opacity:.72;font-size:11px;padding:0 10px 0 4px}
#proto :focus-visible{outline:2px solid #fde047;outline-offset:1px}
@media (max-width:900px){#proto .nota{display:none}#proto .var{min-width:120px}}

/* ================= A · TABLERO (papel técnico, claro) ================= */
body.v-A{--bg:#f1eee6;--card:#fbfaf7;--line:#d9d2c3;--grid:#e6e0d3;--ink:#1c1b18;--mut:#625e55;--acc:#c2410c;--acc-soft:rgba(194,65,12,.1);--prev:#9e978a;--bueno:#256d43;--malo:#b42318;--alerta:#8a4b00;--malo-bg:#fae4e1;--bueno-bg:#e0f0e5;--neutro-bg:#ebe7de;--foco:#c2410c;
  background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif}
body.v-A::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.a-shell{position:relative;z-index:1;min-height:100vh}
.a-shell.con-chat{padding-right:384px}
.a-col{min-width:0}
.a-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:18px;padding:10px 26px;background:rgba(251,250,247,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.a-marca{display:flex;align-items:center;gap:10px}
.a-logo{width:32px;height:32px;display:grid;place-items:center;background:var(--ink);color:var(--card);font-weight:800;font-stretch:125%;font-size:16px;border-radius:7px}
.a-marca b{display:block;font-weight:800;font-stretch:125%;letter-spacing:.05em;font-size:14.5px}
.a-marca small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.a-cli{padding-left:18px;border-left:1px solid var(--line)}
.a-cli small,.a-et{display:block;font-family:'Martian Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.a-cli b{display:block;font-size:15px;font-weight:650;margin-top:3px}
.a-mod{display:flex;gap:2px;margin-left:6px}
.a-mod button{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--mut)}
.a-mod button[aria-current="page"]{background:var(--ink);color:var(--card)}
.a-mod button:disabled{opacity:.8}
.a-mod i{font-style:normal;font-family:'Martian Mono',monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:2px 4px}
.a-vivo{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:'Martian Mono',monospace;font-size:10.5px;color:var(--mut)}
.pulso{width:8px;height:8px;border-radius:50%;background:#2c9a5a;animation:pulso 2.2s infinite;flex:none}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(44,154,90,.55)}70%{box-shadow:0 0 0 7px rgba(44,154,90,0)}100%{box-shadow:0 0 0 0 rgba(44,154,90,0)}}
.a-btn-chat{display:flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--card);padding:9px 14px;border-radius:9px;font-weight:600;font-size:13px}
.a-btn-chat[aria-expanded="true"]{background:var(--card);color:var(--ink)}
.a-main{padding:22px 26px 36px;min-width:0}
.a-titulo{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.a-titulo h1{font-size:30px;line-height:1.05;font-weight:750;font-stretch:115%;letter-spacing:-.01em}
.a-titulo p{color:var(--mut);font-size:13px;margin-top:6px}
.a-filtros{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.seg{display:inline-flex;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-size:13px;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card);font-weight:600}
.a-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);cursor:pointer}
.a-check input{width:16px;height:16px;accent-color:var(--ink)}
.a-ver{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.a-ver select{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);max-width:280px}
.a-migas{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;font-size:12.5px;color:var(--mut)}
.a-migas button{border:0;background:transparent;color:var(--acc);text-decoration:underline;text-underline-offset:3px;padding:2px}
.a-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0 10px}
.a-kpi{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px 14px;min-width:0;animation:sube .5s ease both}
.a-kpi:nth-child(2){animation-delay:.05s}.a-kpi:nth-child(3){animation-delay:.1s}.a-kpi:nth-child(4){animation-delay:.15s}
@keyframes sube{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.a-kpi-val{margin:12px 0 8px;font-family:'Martian Mono',monospace;font-weight:600;font-size:31px;line-height:1;letter-spacing:-.03em;white-space:nowrap}
.a-kpi-val span{font-family:'Archivo',sans-serif;font-weight:500;font-size:14px;color:var(--mut);margin-left:5px;letter-spacing:0}
.a-kpi-fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.a-kpi-exp{margin-top:10px;font-size:12.5px;line-height:1.45;color:var(--mut)}
.a-kpi .spark{position:absolute;right:14px;top:14px}
.a-notas-glob{margin:0 2px 16px}
.a-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.a-w{grid-column:span var(--span,6);background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-width:0;scroll-margin-top:80px}
.a-w.nuevo{animation:aparece 1.2s ease}
@keyframes aparece{0%{box-shadow:0 0 0 3px var(--acc);transform:translateY(8px)}100%{box-shadow:0 0 0 0 transparent;transform:none}}
.a-w-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 14px 0 16px}
.a-w-h h3{font-size:15px;font-weight:650;line-height:1.25}
.a-w-h p{margin-top:3px;font-size:12px;color:var(--mut)}
.a-pin-tag{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-family:'Martian Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);border:1px solid var(--acc);border-radius:4px;padding:2px 5px;vertical-align:2px}
.a-w-acc{display:flex;gap:2px;flex:none}
.a-ico{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--mut)}
.a-ico:hover,.a-ico[aria-expanded="true"]{border-color:var(--line);color:var(--ink);background:#f3f0e9}
.a-w-edit{display:flex;flex-wrap:wrap;gap:12px;margin:10px 14px 0 16px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;background:#f5f2eb}
.a-w-edit label{display:flex;flex-direction:column;gap:5px;font-family:'Martian Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.a-w-edit select{font-family:'Archivo',sans-serif;font-size:13px;text-transform:none;letter-spacing:0;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
.a-w-b{padding:6px 10px 0;flex:1;min-width:0}
.a-w-pie{padding:8px 16px 14px}
.a-rep{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.a-ley{list-style:none;margin:0;padding:0 6px 4px;display:grid;gap:2px}
.a-ley button{display:grid;grid-template-columns:10px minmax(0,1fr) auto 44px;gap:8px;align-items:center;width:100%;border:0;background:transparent;padding:5px 6px;border-radius:7px;text-align:left;font-size:12.5px}
.a-ley button:not(:disabled):hover{background:#f1ede5}
.a-ley button:disabled{cursor:default;color:var(--ink)}
.a-ley i{width:10px;height:10px;border-radius:3px}
.a-ley .v{font-family:'Martian Mono',monospace;font-size:11.5px}
.a-ley .p{font-family:'Martian Mono',monospace;font-size:11px;color:var(--mut);text-align:right}
.a-ley span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-chat{position:fixed;top:0;right:0;bottom:0;width:384px;display:flex;flex-direction:column;background:var(--card);border-left:1px solid var(--line);z-index:6;animation:desliza .25s ease}
@keyframes desliza{from{transform:translateX(16px);opacity:0}to{transform:none;opacity:1}}
.a-chat-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.a-chat-h h2{font-size:17px;font-weight:700;font-stretch:112%}
.a-chat-h p{font-size:12px;color:var(--mut);margin-top:3px}
.a-chat-log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.a-chat-intro{font-size:13px;line-height:1.5;color:var(--mut)}
.a-chat-pie{border-top:1px solid var(--line);padding:12px 16px 16px;display:grid;gap:10px;background:#f7f5ef}
.a-chat-pie form{display:flex;gap:6px}
.a-chat-pie input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 11px;font-size:13.5px}
.a-chat-pie button[type=submit]{border:0;background:var(--ink);color:var(--card);border-radius:9px;padding:0 14px;font-weight:600;font-size:13px}
.a-chat-nota{font-size:11px;line-height:1.4;color:var(--mut)}
@media (max-width:1180px){.a-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.a-w{grid-column:span 12}
  .a-shell.con-chat{padding-right:0}.a-chat{width:min(400px,100%);box-shadow:-24px 0 48px rgba(0,0,0,.18)}
  .a-mod i,.a-vivo span.largo{display:none}}
@media (max-width:760px){.a-top{flex-wrap:wrap;padding:10px 14px}.a-main{padding:16px 14px}.a-kpis{grid-template-columns:1fr}.a-vivo{display:none}}

/* ================= B · INFORME VIVO (editorial) ================= */
body.v-B{--bg:#f6f0e6;--card:#fffdf8;--line:#ddd0bc;--grid:#ebe1d1;--ink:#211b15;--mut:#655a4d;--acc:#a8401a;--acc-soft:rgba(168,64,26,.1);--prev:#a3937e;--bueno:#2f6b4b;--malo:#a3301a;--alerta:#8a4b00;--malo-bg:#f6e0d8;--bueno-bg:#e2eee5;--neutro-bg:#ede5d8;--foco:#a8401a;
  background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif}
.b-page{max-width:1200px;margin:0 auto;padding:26px 32px 40px;display:grid;grid-template-columns:210px minmax(0,1fr);column-gap:52px}
.b-mast{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.b-mast .vivo{display:flex;gap:8px;align-items:center;letter-spacing:.04em;text-transform:none;font-weight:500;color:var(--mut);font-size:12px}
.b-head{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:44px;align-items:end;padding:28px 0 30px;border-bottom:1px solid var(--line);animation:entra .6s ease both}
.b-head h1{font-family:'Fraunces',serif;font-weight:600;font-size:66px;line-height:.95;letter-spacing:-.03em;font-variation-settings:'opsz' 144}
.b-head h2{margin-top:14px;font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:23px;line-height:1.2;color:var(--mut)}
.b-lede{font-family:'Fraunces',serif;font-size:19px;line-height:1.58;font-variation-settings:'opsz' 24}
.b-lede strong{font-weight:650;color:var(--acc)}
.b-rail{position:sticky;top:20px;align-self:start;padding-top:30px}
.b-rail h2,.b-per h2{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:0 0 8px 10px}
.b-rail ol{list-style:none;margin:0 0 26px;padding:0;display:grid;gap:1px}
.b-rail a{display:flex;gap:10px;padding:7px 10px;border-radius:8px;color:var(--mut);text-decoration:none;font-size:13.5px;line-height:1.3}
.b-rail a:hover{background:#efe5d6;color:var(--ink)}
.b-rail a b{font-family:'Fraunces',serif;font-weight:600;color:var(--acc);min-width:14px}
.b-per{display:grid;gap:2px}
.b-per button{text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:8px;font-size:13.5px;color:var(--mut)}
.b-per button[aria-pressed="true"]{background:var(--ink);color:var(--card);font-weight:600}
.b-main{min-width:0}
.b-sec{padding:34px 0;border-bottom:1px solid var(--line);display:grid;gap:16px;scroll-margin-top:16px}
.b-kicker{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.b-sec h3{font-family:'Fraunces',serif;font-weight:600;font-size:33px;line-height:1.1;letter-spacing:-.018em;max-width:26ch;font-variation-settings:'opsz' 72}
.b-cifra{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px;font-family:'Fraunces',serif;font-weight:500;font-size:58px;line-height:1;letter-spacing:-.035em}
.b-cifra small{font-family:'Instrument Sans',sans-serif;font-size:16px;font-weight:500;letter-spacing:0;color:var(--mut)}
.b-fig{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:14px 12px 8px}
.b-cap{font-size:13px;line-height:1.5;color:var(--mut);margin:8px 4px 2px}
.b-sug{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:15px 18px;background:#f0e2cd;border-left:3px solid var(--acc);font-size:15px;line-height:1.55}
.b-sug b{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);padding-top:4px}
.b-dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.b-lista{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.b-lista li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:14.5px;padding-bottom:8px;border-bottom:1px dotted var(--line)}
.b-lista i{width:12px;height:12px;border-radius:2px;transform:translateY(1px)}
.b-lista .v{font-variant-numeric:tabular-nums;font-weight:600}
.b-lista .v small{font-weight:400;color:var(--mut);margin-left:6px}

<body>
<a class="saltar" href="#app">Saltar al contenido</a>
<div id="app" tabindex="-1"></div>
<nav id="proto" aria-label="Controles del prototipo"></nav>
<script id="datos" type="application/json">null</script>
<script src="vendor/echarts.min.js"></script>
<script src="vendor/html2canvas.min.js"></script>
<script>
'use strict';
/* =====================================================================
   NÚCLEO COMPARTIDO: datos, cálculos, formato, gráficos y chat simulado.
   Cada variante (A, B, C) solo decide la estructura de la página.
   ===================================================================== */
const RAW = document.getElementById('datos').textContent.trim();
const D = RAW && RAW !== 'null' ? JSON.parse(RAW) : null;
const REDUCIR = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

const VARIANTES = {A: 'Tablero', B: 'Informe vivo', C: 'Explorador', D: 'Chat primero'};
const PERIODOS = {'7d': 'Últimos 7 días', mes: 'Este mes', mes_ant: 'Mes pasado'};
const NOCHE_H = [0, 1, 2, 3, 4, 5, 6, 7, 22, 23];            // 22:00–08:00 (definición del reporte mensual)
const HORAS = Array.from({length: 24}, (_, h) => String(h).padStart(2, '0'));

/* ---------- Formato (es-PE: miles con coma, decimales con punto) ---------- */
const NF = [0, 1, 2].map(d => new Intl.NumberFormat('es-PE', {minimumFractionDigits: d, maximumFractionDigits: d}));
const [nf0, nf1, nf2] = NF;
const MENOS = '−';
function energia(kwh) {
  const a = Math.abs(kwh);
  if (a >= 10000) return [nf2.format(kwh / 1000), 'MWh'];
  if (a >= 100) return [nf0.format(kwh), 'kWh'];
  return [nf1.format(kwh), 'kWh'];
}
const energiaTxt = kwh => energia(kwh).join(' ');
function dinero(x, mon) {
  if (x == null || !isFinite(x)) return '—';
  const a = Math.abs(x);
  if (a >= 1e6) return `${mon} ${nf2.format(x / 1e6)} millones`;
  if (a >= 1e4) return `${mon} ${nf1.format(x / 1e3)} mil`;
  return `${mon} ${nf0.format(x)}`;
}
const pct = (x, d = 0) => `${NF[d].format(x * 100)}%`;
const compacto = v => Math.abs(v) >= 1000 ? `${nf1.format(v / 1000)} k` : nf0.format(v);
const DS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const DL = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const ML = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const pad = n => String(n).padStart(2, '0');
const diaCorto = f => `${DS[f.getUTCDay()]} ${f.getUTCDate()}`;
const diaMedio = f => `${DS[f.getUTCDay()]} ${f.getUTCDate()} ${MS[f.getUTCMonth()]}`;
const diaLargo = f => `${DL[f.getUTCDay()]} ${f.getUTCDate()} de ${ML[f.getUTCMonth()]}`;
const horaLima = dt => { const x = new Date(dt.getTime() - 5 * 36e5); return `${pad(x.getUTCHours())}:${pad(x.getUTCMinutes())}`; };
const fechaLima = dt => { const x = new Date(dt.getTime() - 5 * 36e5); return new Date(Date.UTC(x.getUTCFullYear(), x.getUTCMonth(), x.getUTCDate())); };

/* Variación vs periodo anterior: más consumo = rojo (malo), menos = verde. */
function deltaHtml(x, contra) {
  if (x == null || !isFinite(x)) return '<span class="delta neutro">sin comparación</span>';
  const sube = x > 0.005, baja = x < -0.005;
  const cls = sube ? 'malo' : baja ? 'bueno' : 'neutro';
  const txt = sube ? `+${pct(x, 1)}` : baja ? `${MENOS}${pct(-x, 1)}` : 'igual';
  const sr = sube ? 'más' : baja ? 'menos' : 'sin cambio';
  return `<span class="delta ${cls}"><span aria-hidden="true">${sube ? '▲' : baja ? '▼' : '='}</span>${txt}<span class="sr"> ${sr} que ${esc(contra || 'el periodo anterior')}</span></span>`;
}
function deltaPP(x, contra) {          // diferencia en puntos porcentuales
  if (x == null || !isFinite(x)) return '<span class="delta neutro">sin comparación</span>';
  const pp = x * 100, sube = pp > 0.15, baja = pp < -0.15;
  const cls = sube ? 'malo' : baja ? 'bueno' : 'neutro';
  const txt = sube ? `+${nf1.format(pp)} pp` : baja ? `${MENOS}${nf1.format(-pp)} pp` : 'igual';
  return `<span class="delta ${cls}"><span aria-hidden="true">${sube ? '▲' : baja ? '▼' : '='}</span>${txt}<span class="sr"> puntos porcentuales ${esc(`frente a ${contra || 'el periodo anterior'}`.replace(/^frente a el /, 'frente al '))}</span></span>`;
}
const ICON = {
  rayo: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>',
  termo: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z"/></svg>',
  gota: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s6 6.4 6 11a6 6 0 0 1-12 0c0-4.6 6-11 6-11z"/></svg>',
  chat: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  pin: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 6 3 3v2H7v-2l3-3-1-6zM12 15v6"/></svg>',
  lapiz: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>',
  x: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  lupa: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>',
  flecha: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
};

/* ---------- Tiempo: índices de hora y de día desde t0 (medianoche Lima) ---------- */
const T0 = D ? new Date(D.t0) : null;
const DIA0 = D ? Date.UTC(+D.t0.slice(0, 4), +D.t0.slice(5, 7) - 1, +D.t0.slice(8, 10)) : 0;
const fecha = d => new Date(DIA0 + d * 864e5);                 // fecha local (Lima) como fecha UTC
const idxDia = (y, m, d) => Math.round((Date.UTC(y, m, d) - DIA0) / 864e5);
const sumR = (s, a, b) => { let t = 0; for (let i = Math.max(0, a); i < b; i++) t += s[i]; return t; };
const suma = a => a.reduce((t, x) => t + x, 0);
const prom = a => a.length ? suma(a) / a.length : 0;
function pctl(a, q) { if (!a.length) return 0; const v = a.slice().sort((x, y) => x - y); return v[Math.min(v.length - 1, Math.round(q * (v.length - 1)))]; }
const r1 = v => v == null ? null : Math.round(v * 10) / 10;

/* ---------- Modelo por cliente: árbol de medición y series horarias ---------- */
const MODELOS = {};
function modelo(clave) {
  if (MODELOS[clave]) return MODELOS[clave];
  const c = D.clientes[clave], N = D.n_horas;
  const nodos = new Map();
  const prep = (n, padre, fuera, nivel) => {
    n.padre = padre; n.fuera = fuera; n.nivel = nivel; nodos.set(n.id, n);
    n.hijos.forEach(h => prep(h, n, fuera, nivel + 1));
  };
  prep(c.arbol, null, false, 0);
  c.fuera.forEach(f => prep(f, null, true, 1));
  const cero = new Float64Array(N);
  const serie = n => {
    if (n.s) return n.s;
    if (n.punto) n.s = Float64Array.from(c.kwh[n.punto] || cero);
    else { const s = new Float64Array(N); n.hijos.forEach(h => { const x = serie(h); for (let i = 0; i < N; i++) s[i] += x[i]; }); n.s = s; }
    return n.s;
  };
  const hasta = new Date(c.datos_hasta || D.datos_hasta);
  const hHasta = Math.min(N - 1, Math.floor((hasta - T0) / 36e5));
  const m = {clave, c, nodos, serie, raiz: c.arbol, hasta, hHasta, dHoy: Math.floor(hHasta / 24), cache: new Map()};
  // Color fijo por tablero (primer nivel del árbol): lo comparten todos los gráficos.
  m.colorDe = (n, pal) => {
    let x = n; while (x.padre && x.padre !== m.raiz) x = x.padre;
    const i = m.raiz.hijos.indexOf(x);
    return i >= 0 ? pal[i % pal.length] : pal[pal.length - 1];
  };
  return (MODELOS[clave] = m);
}
const hojasDe = n => { const out = []; const w = x => x.hijos.forEach(h => h.hijos.length ? w(h) : out.push(h)); w(n); return out; };
const puntosDe = n => n.punto ? [n.punto] : n.hijos.flatMap(h => h.punto ? [h.punto] : []);
const ruta = n => { const r = []; for (let x = n; x; x = x.padre) r.unshift(x); return r; };
const sinTildes = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

function periodo(m, clave) {
  const hoy = fecha(m.dHoy), y = hoy.getUTCFullYear(), mo = hoy.getUTCMonth();
  if (clave === 'mes' && hoy.getUTCDate() === 1) clave = 'mes_ant';
  let d0, d1, p0, p1;
  if (clave === '7d') { d0 = m.dHoy - 7; d1 = m.dHoy; p0 = d0 - 7; p1 = d0; }
  else if (clave === 'mes') { d0 = idxDia(y, mo, 1); d1 = m.dHoy; p0 = idxDia(y, mo - 1, 1); p1 = p0 + (d1 - d0); }
  else { d0 = idxDia(y, mo - 1, 1); d1 = idxDia(y, mo, 1); p0 = idxDia(y, mo - 2, 1); p1 = d0; }
  const okPrev = p0 >= 0;
  const mesA = ML[mo], mesP = ML[(mo + 11) % 12], mesP2 = ML[(mo + 10) % 12];
  return {
    clave, d0, d1, p0, p1, okPrev, nombre: PERIODOS[clave],
    rango: rangoTxt(d0, d1 - 1), rangoPrev: okPrev ? rangoTxt(p0, p1 - 1) : null,
    frase: {'7d': 'los últimos 7 días', mes: `lo que va de ${mesA}`, mes_ant: mesP}[clave],
    fraseEn: {'7d': 'en los últimos 7 días', mes: `en lo que va de ${mesA}`, mes_ant: `en ${mesP}`}[clave],
    fraseComp: {'7d': 'los 7 días anteriores', mes: `el mismo tramo de ${mesP}`, mes_ant: mesP2}[clave],
  };
}
function rangoTxt(a, b) {
  const fa = fecha(a), fb = fecha(b);
  if (a === b) return diaMedio(fa);
  if (fa.getUTCDate() === 1 && fecha(b + 1).getUTCDate() === 1 && fa.getUTCMonth() === fb.getUTCMonth()) return ML[fa.getUTCMonth()];
  if (fa.getUTCMonth() === fb.getUTCMonth()) return `${fa.getUTCDate()}–${fb.getUTCDate()} ${MS[fb.getUTCMonth()]}`;
  return `${fa.getUTCDate()} ${MS[fa.getUTCMonth()]} – ${fb.getUTCDate()} ${MS[fb.getUTCMonth()]}`;
}

function cobertura(m, n, a, b) {
  const pts = puntosDe(n); if (!pts.length || b <= a) return 1;
  let t = 0; pts.forEach(p => { const l = m.c.lect[p] || []; for (let i = a; i < b; i++) t += l[i] || 0; });
  return Math.min(1, t / (60 * (b - a) * pts.length));
}

/* Todo lo que muestran los widgets para un nodo y un periodo (con caché). */
function calc(m, nodo, per) {
  const key = `${nodo.id}|${per.clave}`;
  if (m.cache.has(key)) return m.cache.get(key);
  const s = m.serie(nodo);
  const dias = [], matriz = [], porHora = HORAS.map(() => []);
  const lab = new Array(24).fill(0), fds = new Array(24).fill(0);
  let noche = 0, punta = 0, kLab = 0, kFds = 0, nLab = 0, nFds = 0;
  for (let d = per.d0; d < per.d1; d++) {
    const f = fecha(d), wd = f.getUTCDay(), esLab = wd >= 1 && wd <= 5;
    let tot = 0, no = 0; const fila = [];
    for (let h = 0; h < 24; h++) {
      const v = s[d * 24 + h]; tot += v; fila.push(v); porHora[h].push(v);
      if (h < 8 || h >= 22) no += v;
      if (esLab && h >= 18 && h <= 22) punta += v;
      (esLab ? lab : fds)[h] += v;
    }
    noche += no; matriz.push(fila);
    if (esLab) { nLab++; kLab += tot; } else { nFds++; kFds += tot; }
    dias.push({d, f, kwh: tot, noche: no});
  }
  const prev = []; let pPunta = 0;
  if (per.okPrev) for (let d = per.p0; d < per.p1; d++) {
    const f = fecha(d), wd = f.getUTCDay(); let tot = 0, no = 0;
    for (let h = 0; h < 24; h++) { const v = s[d * 24 + h]; tot += v; if (h < 8 || h >= 22) no += v; if (wd >= 1 && wd <= 5 && h >= 18 && h <= 22) pPunta += v; }
    prev.push({d, f, kwh: tot, noche: no});
  }
  const a = per.d0 * 24, b = per.d1 * 24;
  const total = suma(dias.map(x => x.kwh)), nd = dias.length || 1, promDia = total / nd;
  const pTot = suma(prev.map(x => x.kwh)), pProm = prev.length ? pTot / prev.length : null;
  const pNoche = prev.length ? suma(prev.map(x => x.noche)) / prev.length : null;
  const sumNodo = n => sumR(m.serie(n), a, b);
  const nocheNodo = n => { const t = m.serie(n); let x = 0; for (let d = per.d0; d < per.d1; d++) for (const h of NOCHE_H) x += t[d * 24 + h]; return x / nd; };
  const hijos = nodo.hijos.map(n => ({nodo: n, kwh: sumNodo(n)})).sort((x, y) => y.kwh - x.kwh);
  const otros = nodo.punto && nodo.hijos.length ? total - suma(hijos.map(x => x.kwh)) : null;
  const hojas = hojasDe(nodo).map(n => ({nodo: n, kwh: sumNodo(n), noche: nocheNodo(n), cob: cobertura(m, n, a, b)})).sort((x, y) => y.kwh - x.kwh);
  const max = dias.reduce((x, y) => y.kwh > x.kwh ? y : x, dias[0]);
  const min = dias.reduce((x, y) => y.kwh < x.kwh ? y : x, dias[0]);
  const raizTot = nodo === m.raiz ? total : sumNodo(m.raiz);
  const t = m.c.tarifa, curva = porHora.map(prom), p95 = porHora.map(v => pctl(v, 0.95));
  const k = {
    m, nodo, per, dias, prev, matriz, total, nd, prom: promDia, pTot, pProm,
    delta: pProm ? promDia / pProm - 1 : null,
    nocheDia: noche / nd, nocheTot: noche, nochePct: total ? noche / total : 0,
    deltaNoche: pNoche ? (noche / nd) / pNoche - 1 : null,
    punta, puntaPct: total ? punta / total : 0, pPuntaPct: pTot ? pPunta / pTot : null,
    curva, p95, curvaLab: lab.map(v => nLab ? v / nLab : null), curvaFds: fds.map(v => nFds ? v / nFds : null),
    kLab, kFds, nLab, nFds, hijos, otros, hojas, max, min,
    cob: cobertura(m, nodo, a, b), share: nodo.fuera ? null : (raizTot ? total / raizTot : null),
    costo: t.kwh ? total * t.kwh : null, kwPico: Math.max(...p95), hPico: p95.indexOf(Math.max(...p95)),
  };
  m.cache.set(key, k);
  return k;
}
function partes(k) {          // tableros/circuitos hijos + "otros no desagregados" (si es positivo)
  const out = k.hijos.map(x => ({id: x.nodo.id, nodo: x.nodo, nombre: x.nodo.nombre, kwh: x.kwh}));
  if (k.otros != null && k.otros > 0.005 * k.total) out.push({id: null, nombre: 'Otros no desagregados', kwh: k.otros, otros: true});
  return out;
}
/* Color de cada parte: en la sede, el color fijo de su tablero; dentro de un tablero, por orden. */
const colorParte = (k, it, i, tema) => it.otros ? tema.otros
  : (k.nodo === k.m.raiz && it.nodo ? k.m.colorDe(it.nodo, tema.pal) : tema.pal[i % tema.pal.length]);
function notas(k, que = 'todo') {
  const out = [];
  if (que === 'todo' || que === 'cob') {
    if (k.per.d1 === k.m.dHoy) out.push({t: 'Hoy no se incluye: el día todavía está en curso.'});
    if (k.cob < 0.97) out.push({t: `Llegó el ${pct(k.cob)} de las lecturas esperadas; la energía de los huecos se recupera con el contador.`});
  }
  if ((que === 'todo' || que === 'rep') && k.otros != null && k.otros < -0.01 * k.total)
    out.push({t: `Los circuitos de ${k.nodo.nombre} suman ${pct(-k.otros / k.total)} más que su llave general: hay que revisar esa medición.`, alerta: true});
  if (que === 'todo' || que === 'rank') {
    const quietos = k.hojas.filter(x => x.kwh / k.nd < 0.1 && x.cob > 0.5).map(x => x.nodo.nombre);
    if (quietos.length) out.push({t: `Sin consumo registrado: ${quietos.join(', ')} (llegan lecturas, pero el contador no avanza).`, alerta: true});
  }
  return out;
}
const notasHtml = (lista, cls = '') => lista.length ? `<ul class="notas ${cls}">${lista.map(n => `<li class="${n.alerta ? 'alerta' : ''}">${esc(n.t)}</li>`).join('')}</ul>` : '';
function spark(vals, color, w = 92, h = 28) {
  if (!vals.length) return '';
  const max = Math.max(...vals), min = Math.min(...vals), r = max - min || 1;
  const pts = vals.map((v, i) => `${(1 + i / Math.max(1, vals.length - 1) * (w - 2)).toFixed(1)},${(h - 2 - (v - min) / r * (h - 4)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* ---------- Gráficos (ECharts). El tema lo pone cada variante. ---------- */
const TEMAS = {
  A: {ink: '#1c1b18', mut: '#625e55', line: '#d9d2c3', grid: '#ebe6db', card: '#fbfaf7', acc: '#c2410c', accSoft: 'rgba(194,65,12,.11)', prev: '#8f887b', otros: '#cfc7b6', alto: '#7c2d12', bajo: '#2b59c3', noche: '#2b3a55', tipBg: '#1c1b18', tipInk: '#fbfaf7', punta: 'rgba(43,89,195,.07)', sobre: '#fff',
      font: 'Archivo, system-ui, sans-serif', mono: '"Martian Mono", ui-monospace, monospace',
      pal: ['#c2410c', '#2b59c3', '#256d43', '#a87b00', '#6d4bab', '#0e7490', '#9f1239'], heat: ['#f6f2ea', '#fbd9c0', '#f4a06a', '#d9531e', '#7c2d12']},

  montar(app) {

<script>
'use strict';
/* ------------------------- Eventos (delegados) e inicio ------------------------- */
const SUAVE = REDUCIR ? 'auto' : 'smooth';
function trasPreguntar() {
  if (estado.variante === 'C') { const q = $('#c-q'); if (q) q.blur(); window.scrollTo({top: 0, behavior: SUAVE}); }
  else if (estado.variante === 'B') { const ms = $$('.b-log .msg'); if (ms.length) ms[ms.length - 1].scrollIntoView({block: 'nearest', behavior: SUAVE}); }
}
function quitar(id) {
  const v = estado.variante;
  if (v === 'A') quitarDe(widgetsA(), id); else if (v === 'D') quitarDe(dashD(), id); else quitarDe(extraDe(v), id);
  if (id.startsWith('f')) { const mid = id.slice(1).split('~')[0], msg = logDe().find(x => x.id === mid); if (msg) msg.fijado = false; }
  if (estado.A.editando === id) estado.A.editando = null;
  render();
}
/* Arrastrar y soltar (A): se toma por ⠿; la grilla se compacta sola (grid-auto-flow: dense). */
let ARRASTRA = null, SUELTA = null;
const limpiarDrop = () => $$('.drop-antes, .drop-despues').forEach(x => x.classList.remove('drop-antes', 'drop-despues'));
document.addEventListener('dragstart', e => {
  const asa = e.target.closest && e.target.closest('.a-asa');
  if (!asa) return;
  const card = asa.closest('.a-w');
  ARRASTRA = card.dataset.w; SUELTA = null;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', ARRASTRA);
  try { e.dataTransfer.setDragImage(card, 28, 24); } catch (_) { /* navegadores sin setDragImage */ }
  requestAnimationFrame(() => card.classList.add('arrastrando'));
});
document.addEventListener('dragover', e => {
  if (!ARRASTRA) return;
  const card = e.target.closest && e.target.closest('.a-w[data-w]');
  limpiarDrop();
  if (!card || card.dataset.w === ARRASTRA) { SUELTA = null; return; }
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const r = card.getBoundingClientRect(), fila = r.width > card.parentElement.clientWidth * 0.9;
  const antes = fila ? e.clientY < r.top + r.height / 2 : e.clientX < r.left + r.width / 2;
  card.dataset.lado = fila ? 'v' : 'h';
  card.classList.add(antes ? 'drop-antes' : 'drop-despues');
  SUELTA = {id: card.dataset.w, antes};
});
document.addEventListener('drop', e => {
  if (!ARRASTRA) return;
  e.preventDefault();
  const s = SUELTA, id = ARRASTRA;
  ARRASTRA = SUELTA = null;
  if (s) moverA(id, s.id, s.antes);
});
document.addEventListener('dragend', () => {
  ARRASTRA = SUELTA = null; limpiarDrop();
  $$('.a-w.arrastrando').forEach(x => x.classList.remove('arrastrando'));
});
document.addEventListener('click', e => {
  const p = e.target.closest('[data-p]');
  if (p) {
    if (p.dataset.p === 'prev') cambiarVariante(-1);
    else if (p.dataset.p === 'next') cambiarVariante(1);
    else if (p.dataset.p === 'cliente' && p.dataset.v !== estado.cliente) {
      estado.cliente = p.dataset.v; estado.foco = 'sede'; estado.A.editando = null; render();
    }
    return;
  }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const v = el.dataset.v, enDrop = !!el.closest('.c-drop');
  switch (el.dataset.act) {
    case 'periodo': estado.periodo = v; render(); break;
    case 'foco': irA(v); break;
    case 'chip': preguntar(null, v); trasPreguntar(); break;
    case 'c-libre': { const q = $('#c-q'); preguntar(q ? q.value.trim() : ''); trasPreguntar(); break; }
    case 'fijar': fijar(v); break;
    case 'quitar': quitar(v); break;
    case 'editar': estado.A.editando = estado.A.editando === v ? null : v; render(); break;
    case 'chat':
      estado.A.chat = !estado.A.chat; render();
      (estado.A.chat ? $('#a-q') : $('[data-k="chat-abrir"]'))?.focus();
      break;
    case 'c-cerrar': { const msg = logDe().find(x => x.id === v); if (msg) msg.oculto = true; render(); break; }
    case 'a-add': estado.A.paleta = !estado.A.paleta; render(); break;
    case 'a-nuevo': {
      const sp = {id: `n${++SEQ}-${v}`, tipo: v, span: A_SPAN[v] || 6, nuevo: true};
      if (v === 'diario') sp.grafico = 'bar';
      if (v === 'reparto') sp.grafico = 'dona';
      widgetsA().push(sp); estado.A.paleta = false; render();
      const w = document.querySelector(`[data-w="${sp.id}"]`);
      if (w) w.scrollIntoView({behavior: SUAVE, block: 'center'});
      sp.nuevo = false;
      break;
    }
    case 'a-reset': delete estado.A.lay[`${estado.cliente}:${estado.foco}`]; estado.A.editando = null; render(); break;
    case 'a-mover': moverPaso(v, +el.dataset.paso); break;
    case 'd-vista': estado.D.vista = v; estado.D.aviso = null; render(); window.scrollTo(0, 0); break;
    case 'd-chip': preguntarD(null, v); break;
    case 'd-alt': {
      const msg = logDe().find(x => x.id === v);
      if (msg) { msg.spec = conAlternativa(msg.spec, el.dataset.alt); msg.fijado = false; render(); }
      break;
    }
    case 'd-alt-w': {
      const L = dashD(), i = L.findIndex(x => x.id === v);
      if (i >= 0) { L[i] = {...conAlternativa(L[i], el.dataset.alt), id: L[i].id, span: L[i].span, fijado: true}; render(); }

document.addEventListener('change', e => {

document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]');

  else { preguntar(txt, i); trasPreguntar(); }
});
document.addEventListener('input', e => { if (e.target.id === 'c-q') dropC(e.target); });
document.addEventListener('focusin', e => { if (e.target.id === 'c-q') dropC(e.target); });
document.addEventListener('focusout', e => {
  const cmd = e.target.closest && e.target.closest('.c-cmd');
  if (cmd && !cmd.contains(e.relatedTarget)) { const d = $('#c-drop'); if (d) d.hidden = true; }
});
document.addEventListener('mousedown', e => { if (e.target.closest('.c-drop')) e.preventDefault(); });
document.addEventListener('keydown', e => {
  const t = e.target, escribe = t.closest && t.closest('input, textarea, select, [contenteditable]');
  const asa = t.closest && t.closest('.a-asa');
  if (asa && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
    moverPaso(asa.dataset.v, e.key === 'ArrowUp' || e.key === 'ArrowLeft' ? -1 : 1);
    e.preventDefault();
    return;
  }
  const drop = $('#c-drop');
  if (drop && !drop.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && t.closest && t.closest('.c-cmd')) {
    const bs = $$('button', drop), i = bs.indexOf(document.activeElement);
    const j = e.key === 'ArrowDown' ? (i + 1) % bs.length : (i <= 0 ? bs.length - 1 : i - 1);
    if (bs[j]) bs[j].focus();
    e.preventDefault();
    return;
  }
  if (e.key === 'Escape') {
    if (drop && !drop.hidden) { drop.hidden = true; const q = $('#c-q'); if (q) q.blur(); }
    else if (estado.variante === 'A' && estado.A.chat) { estado.A.chat = false; render(); $('[data-k="chat-abrir"]')?.focus(); }
    return;
  }
  if (escribe || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowLeft') { cambiarVariante(-1); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { cambiarVariante(1); e.preventDefault(); }
  else if (e.key === '/' && estado.variante === 'C') { const q = $('#c-q'); if (q) { q.focus(); e.preventDefault(); } }
});

if (!D) {
  $('#proto').hidden = true;

    <pre>python scripts/prototype_dashboard.py</pre><p>El resultado queda en <code>analisis/prototype_dashboard.html</code>.</p></div>`;
} else {
  estado.A.lay ||= {};

}
